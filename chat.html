<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lead Intelligence Agent</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f5f6fa;
        color: #1e1e2e;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        width: 100%;
        max-width: 720px;
        height: 100vh;
        max-height: 800px;
        display: flex;
        flex-direction: column;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }

      header {
        padding: 20px 24px;
        border-bottom: 1px solid #e5e7eb;
        flex-shrink: 0;
      }

      header h1 {
        font-size: 20px;
        font-weight: 700;
        color: #1e1e2e;
      }

      header p {
        font-size: 13px;
        color: #6b7280;
        margin-top: 4px;
      }

      .chat-area {
        flex: 1;
        overflow-y: auto;
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .bubble {
        max-width: 80%;
        padding: 10px 16px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.5;
        word-wrap: break-word;
      }

      .bubble.user {
        align-self: flex-end;
        background: #2563eb;
        color: #ffffff;
        border-bottom-right-radius: 4px;
      }

      .bubble.agent {
        align-self: flex-start;
        background: #f1f3f5;
        color: #1e1e2e;
        border-bottom-left-radius: 4px;
      }

      .bubble.agent ol {
        margin: 8px 0 0 20px;
        padding: 0;
      }

      .bubble.agent li {
        margin-bottom: 4px;
      }

      .bubble.agent div {
        margin-bottom: 4px;
      }

      .bubble.agent div:last-child {
        margin-bottom: 0;
      }

      .bubble.thinking {
        align-self: flex-start;
        background: #f1f3f5;
        color: #9ca3af;
        font-style: italic;
        border-bottom-left-radius: 4px;
      }

      .bubble.error {
        align-self: flex-start;
        background: #fef2f2;
        color: #dc2626;
        border-bottom-left-radius: 4px;
      }

      .footer {
        padding: 16px 24px;
        border-top: 1px solid #e5e7eb;
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }

      .footer input {
        flex: 1;
        padding: 10px 16px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.15s;
      }

      .footer input:focus {
        border-color: #2563eb;
      }

      .footer button {
        padding: 10px 20px;
        background: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.15s;
      }

      .footer button:hover {
        background: #1d4ed8;
      }

      .footer button:disabled {
        background: #93b4f5;
        cursor: not-allowed;
      }

      @media (max-width: 480px) {
        .container {
          max-height: 100vh;
          border-radius: 0;
          box-shadow: none;
        }

        .chat-area {
          padding: 12px 16px;
        }

        .footer {
          padding: 12px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Lead Intelligence Agent</h1>
        <p>Ask about leads, opportunities, and pipeline status</p>
      </header>
      <div class="chat-area" id="chatArea"></div>
      <div class="footer">
        <input
          type="text"
          id="messageInput"
          placeholder="Type your message..."
          autofocus
        />
        <button id="sendButton">Send</button>
      </div>
    </div>

    <script>
      const API_URL = "http://localhost:3000/agent/chat";
      let conversationHistory = [];

      const chatArea = document.getElementById("chatArea");
      const messageInput = document.getElementById("messageInput");
      const sendButton = document.getElementById("sendButton");

      messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          sendMessage();
        }
      });

      sendButton.addEventListener("click", sendMessage);

      function scrollToBottom() {
        chatArea.scrollTop = chatArea.scrollHeight;
      }

      function formatAgentText(text) {
        const escaped = text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

        const withBold = escaped.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

        const lines = withBold.split("\n");
        let html = "";
        let inList = false;

        for (const line of lines) {
          const numberedMatch = line.match(/^\s*\d+\.\s+(.*)/);
          const subBulletMatch = line.match(/^\s*-\s+(.*)/);
          const isBlank = line.trim() === "";

          if (numberedMatch) {
            if (inList) {
              html += "</li>";
            }
            if (!inList) {
              html += "<ol>";
              inList = true;
            }
            html += `<li>${numberedMatch[1]}`;
          } else if (subBulletMatch && inList) {
            html += `<br>&nbsp;&nbsp;${subBulletMatch[1]}`;
          } else if (isBlank) {
            continue;
          } else {
            if (inList) {
              html += "</li></ol>";
              inList = false;
            }
            html += `<div>${line}</div>`;
          }
        }
        if (inList) {
          html += "</li></ol>";
        }

        return html;
      }

      function appendBubble(text, className, isHTML = false) {
        const bubble = document.createElement("div");
        bubble.className = "bubble " + className;
        if (isHTML) {
          bubble.innerHTML = text;
        } else {
          bubble.textContent = text;
        }
        chatArea.appendChild(bubble);
        scrollToBottom();
        return bubble;
      }

      async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) {
          return;
        }

        appendBubble(message, "user");
        messageInput.value = "";
        sendButton.disabled = true;
        messageInput.disabled = true;

        const thinkingBubble = appendBubble("Agent is thinking...", "thinking");

        try {
          const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message, history: conversationHistory }),
          });

          if (!response.ok) {
            throw new Error("Request failed");
          }

          const data = await response.json();
          conversationHistory.push({ role: "user", content: message });
          conversationHistory.push({ role: "assistant", content: data.response });
          thinkingBubble.remove();
          appendBubble(formatAgentText(data.response), "agent", true);
        } catch (error) {
          thinkingBubble.remove();
          appendBubble("Something went wrong, please try again.", "error");
        } finally {
          sendButton.disabled = false;
          messageInput.disabled = false;
          messageInput.focus();
        }
      }
    </script>
  </body>
</html>
